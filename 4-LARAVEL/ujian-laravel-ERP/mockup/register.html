<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Register NiagaERP</title>
        <link rel="stylesheet" href="assets/app.css" />
    </head>
    <body
        style="
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        "
    >
        <main class="card panel" style="width: min(100%, 430px); padding: 32px">
            <a
                class="brand"
                style="color: #162033; padding: 0"
                href="index.html"
                ><span class="brand-mark">N</span>NiagaERP</a
            >
            <p class="eyebrow" style="margin-top: 32px">BUAT AKUN</p>
            <h1 style="font-size: 27px; margin: 0">Mulai dengan NiagaERP</h1>
            <div class="field" style="margin-top: 25px">
                <label>Nama Lengkap</label
                ><input class="input" value="Budi Santoso" />
            </div>
            <div class="field" style="margin-top: 16px">
                <label>Email</label
                ><input class="input" value="budi@niaga.test" />
            </div>
            <div class="field" style="margin-top: 16px">
                <label>Password</label><input class="input" type="password" />
            </div>
            <a
                class="btn btn-primary"
                style="width: 100%; justify-content: center; margin-top: 24px"
                href="dashboard.html"
                >Buat Akun</a
            >
            <p
                class="muted"
                style="font-size: 13px; text-align: center; margin: 20px 0 0"
            >
                Sudah punya akun?
                <a style="color: #2563eb; font-weight: 700" href="login.html"
                    >Masuk</a
                >
            </p>
        </main>
    </body>
</html>

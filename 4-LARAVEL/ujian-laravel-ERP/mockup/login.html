<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Masuk NiagaERP</title>
        <link rel="stylesheet" href="assets/app.css" />
    </head>
    <body
        style="
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        "
    >
        <main class="card panel" style="width: min(100%, 430px); padding: 32px">
            <a
                class="brand"
                style="color: #162033; padding: 0"
                href="index.html"
                ><span class="brand-mark">N</span>NiagaERP</a
            >
            <p class="eyebrow" style="margin-top: 32px">
                SELAMAT DATANG KEMBALI
            </p>
            <h1 style="font-size: 27px; margin: 0">Masuk ke workspace Anda</h1>
            <p class="muted" style="font-size: 14px">
                Gunakan akun sesuai role perusahaan.
            </p>
            <div class="field" style="margin-top: 25px">
                <label>Email</label
                ><input class="input" value="admin@niaga.test" />
            </div>
            <div class="field" style="margin-top: 16px">
                <label>Password</label
                ><input class="input" type="password" value="password" />
            </div>
            <a
                class="btn btn-primary"
                style="width: 100%; justify-content: center; margin-top: 24px"
                href="dashboard.html"
                >Masuk ke Dashboard</a
            >
            <p
                class="muted"
                style="font-size: 13px; text-align: center; margin: 20px 0 0"
            >
                Belum punya akun?
                <a style="color: #2563eb; font-weight: 700" href="register.html"
                    >Buat akun</a
                >
            </p>
        </main>
    </body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Resep Masakan</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="min-h-screen flex flex-col sm:justify-center items-center pt-6 sm:pt-0">
        <a href="index.html" class="text-2xl font-bold text-blue-600 mb-6">🍳 Resep Masakan</a>

        <div class="w-full sm:max-w-md px-6 py-4 bg-white shadow-md overflow-hidden sm:rounded-lg">
            <h1 class="text-lg font-semibold text-gray-800 mb-4">Login</h1>

            <form class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" class="w-full border rounded px-3 py-2" placeholder="kamu@email.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" class="w-full border rounded px-3 py-2" placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center text-sm text-gray-600">
                        <input type="checkbox" class="rounded border-gray-300 mr-2">
                        Ingat saya
                    </label>
                    <a href="#" class="text-sm text-blue-600 hover:underline">Lupa password?</a>
                </div>

                <button type="button" onclick="location.href='dashboard.html'"
                    class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Login
                </button>
            </form>

            <p class="text-sm text-gray-500 mt-4">
                Belum punya akun? <a href="register.html" class="text-blue-600 hover:underline">Register di sini</a>
            </p>
        </div>
    </div>

</body>
</html>
